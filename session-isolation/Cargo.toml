[package]
name = "session-isolation"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Aislamiento de sesiones por proceso: instantánea lock-free sin unsafe, IPC con timeout y reaping, pool con reemplazo en caliente."
readme = "README.md"
keywords = ["seqlock", "lock-free", "process-pool", "isolation", "ipc"]
categories = ["concurrency", "os"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "trabajador-demo"
path = "src/bin/trabajador-demo.rs"

# Workspace propio: cargo no busca uno en los directorios superiores.
[workspace]
